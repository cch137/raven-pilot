<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raven Pilot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="header">
        <div>
          <div class="title">Raven Pilot</div>
          <div class="meta" id="threadId">Thread: loading…</div>
        </div>
        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Idle</span>
        </div>
      </section>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty" id="emptyState">No messages yet.</div>
      </section>

      <section class="composer">
        <form id="composerForm">
          <textarea id="input" placeholder="Type a message to the agent..."></textarea>
          <div class="actions">
            <div>
              <div class="hint">Thinking can be collapsed, tool calls/results are grouped, and code blocks are formatted.</div>
              <div class="error" id="error"></div>
            </div>
            <button type="submit" id="sendButton">Send</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
