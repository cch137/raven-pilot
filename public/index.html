<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raven Pilot</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121935;
        --panel-2: #182145;
        --text: #e8ecff;
        --muted: #9aa6d1;
        --accent: #7aa2ff;
        --border: #2a356b;
        --user: #204a7a;
        --assistant: #1c2d58;
        --system: #46356b;
        --tool-call: #3f3116;
        --tool-result: #1f3c2e;
        --thinking: #2f2a52;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(180deg, #09101f 0%, #0c1330 100%);
        color: var(--text);
      }

      .app {
        max-width: 1040px;
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        padding: 20px;
      }

      .header, .composer, .messages {
        background: rgba(18, 25, 53, 0.92);
        border: 1px solid var(--border);
        border-radius: 16px;
        backdrop-filter: blur(6px);
      }

      .header {
        padding: 16px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .title { font-size: 20px; font-weight: 700; }
      .meta { color: var(--muted); font-size: 13px; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .dot {
        width: 10px; height: 10px; border-radius: 999px; background: #4ade80;
        box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
      }
      .dot.busy { background: #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }

      .messages {
        padding: 18px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message,
      .tool-group {
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .message {
        padding: 12px 14px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
      }
      .message-user { background: var(--user); }
      .message-assistant { background: var(--assistant); }
      .message-system { background: var(--system); }
      .message-tool-call { background: var(--tool-call); }
      .message-tool-result { background: var(--tool-result); }
      .message-thinking {
        background: var(--thinking);
        border-style: dashed;
      }
      .message-thinking .content {
        font-style: italic;
        opacity: 0.96;
      }
      .message-header,
      .tool-summary {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #c9d4ff;
        font-size: 12px;
        text-transform: uppercase;
      }
      .message-header {
        margin-bottom: 6px;
      }
      .message-title,
      .tool-summary-title {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }
      .badge {
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        text-transform: uppercase;
        color: #d8e1ff;
      }
      .content {
        overflow-x: auto;
      }
      .content p {
        margin: 0 0 10px;
      }
      .content p:last-child {
        margin-bottom: 0;
      }
      .content pre {
        margin: 10px 0 0;
        padding: 12px;
        border-radius: 10px;
        background: rgba(6, 12, 26, 0.55);
        border: 1px solid rgba(255,255,255,.08);
        overflow-x: auto;
        white-space: pre;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      .content code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .content .inline-code {
        padding: 1px 6px;
        border-radius: 6px;
        background: rgba(6, 12, 26, 0.45);
        border: 1px solid rgba(255,255,255,.08);
      }
      .tool-group {
        background: rgba(255,255,255,.02);
      }
      .tool-summary {
        width: 100%;
        padding: 12px 14px;
        background: rgba(255,255,255,.03);
        border: 0;
        color: inherit;
        cursor: pointer;
        text-align: left;
      }
      .tool-summary:hover {
        background: rgba(255,255,255,.05);
      }
      .tool-summary-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .tool-group-body {
        display: grid;
        gap: 10px;
        padding: 0 12px 12px;
      }
      .tool-group .message {
        border-radius: 12px;
      }
      .empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
      }

      .composer { padding: 14px; }
      form { display: grid; gap: 12px; }
      textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel-2);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }
      .actions {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
      }
      .hint { color: var(--muted); font-size: 13px; }
      button {
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #081120;
        font-weight: 700;
        padding: 10px 16px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .error { color: #fca5a5; min-height: 20px; font-size: 13px; }

      @media (max-width: 640px) {
        .app { padding: 12px; }
        .header { align-items: flex-start; flex-direction: column; }
        .actions { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="header">
        <div>
          <div class="title">Raven Pilot</div>
          <div class="meta" id="threadId">Thread: loading…</div>
        </div>
        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Idle</span>
        </div>
      </section>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty" id="emptyState">No messages yet.</div>
      </section>

      <section class="composer">
        <form id="composerForm">
          <textarea id="input" placeholder="Type a message to the agent..."></textarea>
          <div class="actions">
            <div>
              <div class="hint">Thinking can be collapsed, tool calls/results are grouped, and code blocks are formatted.</div>
              <div class="error" id="error"></div>
            </div>
            <button type="submit" id="sendButton">Send</button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const state = {
        threadId: "",
        processing: false,
        messages: [],
      };

      const ui = {
        collapsedThinking: new Set(),
        collapsedToolGroups: new Set(),
      };

      const elements = {
        threadId: document.getElementById("threadId"),
        statusDot: document.getElementById("statusDot"),
        statusText: document.getElementById("statusText"),
        messages: document.getElementById("messages"),
        emptyState: document.getElementById("emptyState"),
        form: document.getElementById("composerForm"),
        input: document.getElementById("input"),
        sendButton: document.getElementById("sendButton"),
        error: document.getElementById("error"),
      };

      function upsertMessage(message) {
        const index = state.messages.findIndex((item) => item.id === message.id);
        if (index === -1) state.messages.push(message);
        else state.messages[index] = message;
      }

      function kindLabel(message) {
        switch (message.kind) {
          case "thinking": return "thinking";
          case "tool-call": return "tool call";
          case "tool-result": return "tool result";
          default: return message.role;
        }
      }

      function messageClass(message) {
        if (message.kind === "thinking") return "message-thinking";
        if (message.kind === "tool-call") return "message-tool-call";
        if (message.kind === "tool-result") return "message-tool-result";
        return `message-${message.role}`;
      }

      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatInline(text) {
        return escapeHtml(text).replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      }

      function renderRichContent(content) {
        const blockPattern = /```([\w-]+)?\n([\s\S]*?)```/g;
        let lastIndex = 0;
        let html = "";
        let match;

        while ((match = blockPattern.exec(content)) !== null) {
          const [full, language = "", code = ""] = match;
          const before = content.slice(lastIndex, match.index);
          html += renderParagraphs(before);
          const lang = language ? `<div class="badge">${escapeHtml(language)}</div>` : "";
          html += `${lang}<pre><code>${escapeHtml(code)}</code></pre>`;
          lastIndex = match.index + full.length;
        }

        html += renderParagraphs(content.slice(lastIndex));
        return html || "<p></p>";
      }

      function renderParagraphs(text) {
        const trimmed = text.replace(/^\n+|\n+$/g, "");
        if (!trimmed) return "";
        return trimmed
          .split(/\n{2,}/)
          .map((paragraph) => `<p>${formatInline(paragraph).replace(/\n/g, "<br>")}</p>`)
          .join("");
      }

      function renderSingleMessage(message) {
        const article = document.createElement("article");
        article.className = `message ${messageClass(message)}`;
        article.dataset.id = message.id;

        const header = document.createElement("div");
        header.className = "message-header";

        const title = document.createElement("div");
        title.className = "message-title";
        const titleText = document.createElement("span");
        titleText.textContent = message.title || message.role;
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = kindLabel(message);
        title.append(titleText, badge);

        const time = document.createElement("span");
        time.textContent = new Date(message.createdAt).toLocaleTimeString();
        header.append(title, time);
        article.append(header);

        if (message.kind === "thinking") {
          const details = document.createElement("details");
          details.open = !ui.collapsedThinking.has(message.id);
          details.addEventListener("toggle", () => {
            if (details.open) ui.collapsedThinking.delete(message.id);
            else ui.collapsedThinking.add(message.id);
          });

          const summary = document.createElement("summary");
          summary.className = "hint";
          summary.textContent = details.open ? "Hide thinking" : "Show thinking";
          details.append(summary);

          const body = document.createElement("div");
          body.className = "content";
          body.innerHTML = renderRichContent(message.content);
          details.append(body);
          article.append(details);
          return article;
        }

        const body = document.createElement("div");
        body.className = "content";
        body.innerHTML = renderRichContent(message.content);
        article.append(body);
        return article;
      }

      function renderToolGroup(messages) {
        const groupId = messages[0].groupId || messages[0].id;
        const call = messages.find((message) => message.kind === "tool-call") || messages[0];
        const result = messages.find((message) => message.kind === "tool-result");

        const wrapper = document.createElement("section");
        wrapper.className = "tool-group";

        const details = document.createElement("details");
        details.open = !ui.collapsedToolGroups.has(groupId);
        details.addEventListener("toggle", () => {
          if (details.open) ui.collapsedToolGroups.delete(groupId);
          else ui.collapsedToolGroups.add(groupId);
        });

        const summary = document.createElement("summary");
        summary.className = "tool-summary";

        const left = document.createElement("div");
        left.className = "tool-summary-title";
        const title = document.createElement("span");
        title.textContent = call.title || "Tool";
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = result ? "completed" : "running";
        left.append(title, badge);

        const right = document.createElement("div");
        right.className = "tool-summary-meta";
        const count = document.createElement("span");
        count.textContent = `${messages.length} item${messages.length > 1 ? "s" : ""}`;
        const time = document.createElement("span");
        time.textContent = new Date(call.createdAt).toLocaleTimeString();
        right.append(count, time);

        summary.append(left, right);
        details.append(summary);

        const body = document.createElement("div");
        body.className = "tool-group-body";
        for (const message of messages) {
          body.append(renderSingleMessage(message));
        }
        details.append(body);
        wrapper.append(details);
        return wrapper;
      }

      function createRenderItems() {
        const items = [];

        for (let index = 0; index < state.messages.length; index += 1) {
          const message = state.messages[index];

          if (message.groupId && (message.kind === "tool-call" || message.kind === "tool-result")) {
            const grouped = [message];
            let cursor = index + 1;
            while (cursor < state.messages.length) {
              const next = state.messages[cursor];
              if (next.groupId !== message.groupId) break;
              grouped.push(next);
              cursor += 1;
            }
            items.push({ type: "tool-group", messages: grouped });
            index = cursor - 1;
            continue;
          }

          items.push({ type: "message", message });
        }

        return items;
      }

      function render() {
        elements.threadId.textContent = `Thread: ${state.threadId || "-"}`;
        elements.statusText.textContent = state.processing ? "Streaming" : "Idle";
        elements.statusDot.classList.toggle("busy", state.processing);
        elements.emptyState.style.display = state.messages.length ? "none" : "block";

        const scrollBottomGap = elements.messages.scrollHeight - elements.messages.scrollTop - elements.messages.clientHeight;
        const shouldStickToBottom = scrollBottomGap < 80;

        elements.messages.querySelectorAll(".message, .tool-group").forEach((node) => node.remove());

        for (const item of createRenderItems()) {
          if (item.type === "tool-group") {
            elements.messages.append(renderToolGroup(item.messages));
          } else {
            elements.messages.append(renderSingleMessage(item.message));
          }
        }

        if (shouldStickToBottom) {
          elements.messages.scrollTop = elements.messages.scrollHeight;
        }
      }

      async function loadSnapshot() {
        const response = await fetch("/api/conversation", { cache: "no-store" });
        if (!response.ok) throw new Error("Failed to load conversation.");
        const snapshot = await response.json();
        state.threadId = snapshot.threadId;
        state.processing = snapshot.processing;
        state.messages = snapshot.messages;
        render();
      }

      async function sendMessage(text) {
        const response = await fetch("/api/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || "Failed to send message.");
        }
      }

      function connectEvents() {
        const source = new EventSource("/api/events");
        source.onmessage = (event) => {
          const payload = JSON.parse(event.data);
          switch (payload.type) {
            case "snapshot":
              state.threadId = payload.data.threadId;
              state.processing = payload.data.processing;
              state.messages = payload.data.messages;
              break;
            case "message-added":
            case "message-updated":
              upsertMessage(payload.data);
              break;
            case "conversation-reset":
              state.threadId = payload.data.threadId;
              state.processing = payload.data.processing;
              state.messages = payload.data.messages;
              break;
            case "processing":
              state.processing = payload.data.processing;
              break;
          }
          render();
        };

        source.onerror = async () => {
          source.close();
          try {
            await loadSnapshot();
          } catch {}
          setTimeout(connectEvents, 1000);
        };
      }

      elements.form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = elements.input.value.trim();
        if (!text) return;

        elements.error.textContent = "";
        elements.sendButton.disabled = true;

        try {
          await sendMessage(text);
          elements.input.value = "";
        } catch (error) {
          elements.error.textContent = error.message || String(error);
        } finally {
          elements.sendButton.disabled = false;
          elements.input.focus();
        }
      });

      loadSnapshot().then(connectEvents).catch((error) => {
        elements.error.textContent = error.message || String(error);
      });
    </script>
  </body>
</html>
